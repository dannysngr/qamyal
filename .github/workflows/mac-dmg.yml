# Собирает установочный образ Qamyal.dmg для Mac на Mac-машине GitHub и выкладывает его в Releases
# (выпуск «mac-latest»). Запускается при изменениях программы или вручную (Actions → Mac DMG → Run workflow).
name: Mac DMG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "mac/**", "third_party/**", ".github/workflows/mac-dmg.yml"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Комплект (как mac/make_kit.ps1)
        run: |
          mkdir -p kit
          cp -R app mac kit/
          cp -R third_party/gigaam kit/gigaam

      - name: Сборка образа
        run: bash kit/mac/build_dmg.sh kit out

      - name: Проверка образа — поставить и запустить, как пользователь
        run: |
          set -x
          DMG=$(ls out/*.dmg)
          hdiutil attach -nobrowse -readonly "$DMG"
          ls -la "/Volumes/Qamyal" "/Volumes/Qamyal/Qamyal.app/Contents/MacOS"
          ditto "/Volumes/Qamyal/Qamyal.app" /Applications/Qamyal.app
          plutil -p /Applications/Qamyal.app/Contents/Info.plist
          file /Applications/Qamyal.app/Contents/MacOS/Qamyal
          codesign -dv --verbose=4 /Applications/Qamyal.app || true
          codesign --verify --deep --strict --verbose=2 /Applications/Qamyal.app || true
          spctl -a -vv /Applications/Qamyal.app || true
          otool -L /Applications/Qamyal.app/Contents/MacOS/Qamyal || true
          open /Applications/Qamyal.app || true
          sleep 8
          pgrep -fl Qamyal || echo "Qamyal НЕ ЗАПУСТИЛСЯ"
          log show --last 2m --style compact --predicate 'process == "Qamyal" OR eventMessage CONTAINS "Qamyal"' | tail -60 || true

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-latest
          name: Qamyal для Mac — последняя сборка
          body: |
            Установочный образ Qamyal для Mac с процессором Apple (M1 и новее), macOS 14.2 или новее.
            Откройте образ, перетащите Qamyal в «Программы» и запустите. Python и библиотеки Qamyal поставит сам,
            модели распознавания — кнопками в Настройках → «Модели и дополнения».
            Если macOS не даёт открыть: Системные настройки → Конфиденциальность и безопасность → «Всё равно открыть».
          files: out/*.dmg
          make_latest: true
